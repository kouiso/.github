name: "バグ修正・機能改修 (PBI)"
description: "今あるものが壊れとる・使いにくい時に使います"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        分かる範囲で埋めてもらえれば十分です。埋まってない所は、こちらから聞きます。

  - type: textarea
    id: why
    attributes:
      label: "なぜ直したいか（必須）"
      description: "困っとることを、そのまま書いてください。技術的な話はいりません。"
      placeholder: |
        例）注文履歴が開けんので、問い合わせが来るたびに手作業で調べとる。
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: "何が起きたか（必須）"
      description: "本当はどうなってほしくて、実際はどうなったか。"
      value: |
        - 本当はこうなってほしい：
        - 実際はこうなった：
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: "どうしたら同じことが起きるか（必須）"
      description: "触った順番に番号で。途中まででも構いません。"
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "どれくらい困っとるか（必須）"
      description: "🔴 を選んだ場合は、確認を待たずに復旧を優先します。"
      options:
        - "🔴 Critical（本番が止まっとる・データが消えた）"
        - "🟠 High（主要な機能が使えん）"
        - "🟡 Medium（回避策はある）"
        - "🟢 Low（軽微・見た目の話）"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "画面の写真・動画（任意）"
      description: "この枠にドラッグ&ドロップするか、コピーしたものを貼り付けてください。動画もいけます。"
    validations:
      required: false

  - type: input
    id: page-url
    attributes:
      label: "その画面のURL（任意）"
      placeholder: "https://..."
    validations:
      required: false

  - type: input
    id: figma-url
    attributes:
      label: "FigmaのURL（任意）"
      placeholder: "https://www.figma.com/design/..."
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: "使っとった環境（任意）"
      description: "分かる範囲で。ここが埋まっとると、原因を掴むまでの時間が大きく変わります。"
      value: |
        - 端末 / OS：
        - ブラウザ / アプリのバージョン：
        - どれくらいの頻度で起きるか：
    validations:
      required: false

  - type: textarea
    id: how-to
    attributes:
      label: "やり方の指定（任意・エンジニア向け）"
      description: "直し方に注文がある時だけ。無ければ空のままで構いません。"
      value: |
        > [!WARNING]
        > ここに書いた内容は「指定」として扱われます。より良い進め方に気づいても、勝手に変えず確認をとります。

        - 該当ファイルパス：
    validations:
      required: false

  - type: textarea
    id: done-definition
    attributes:
      label: "どうなったら終わりか（必須）"
      description: |
        緑の枠は消さず、その下の `- [ ]` の後ろに書いてください。

        <details>
        <summary>📝 書き方の例（押すと開きます）</summary>

        - [ ] 開けんかった画面が、ちゃんと開くようになっとる
        - [ ] 前に出とったエラーが出んようになっとる
        - [ ] 他の画面が崩れとらん
        - [ ] 対象の環境すべてで動く

        </details>
      value: |
        > [!TIP]
        > ここが合否のラインです。「動くこと」やなく「何がどうなっとれば終わりか」を書いてください。

        - [ ]
    validations:
      required: true

  - type: textarea
    id: else
    attributes:
      label: "その他（任意）"
      description: "先に共有しとくほど、後の往復が減ります。迷った点もここへ。"
    validations:
      required: false

  # ⚠️ この how-to-read ブロックは feature.yml と完全に同一です。
  #    文面を変更するときは、必ず両方のファイルに同じ内容を反映してください。
  - type: textarea
    id: how-to-read
    attributes:
      label: "この Issue の読み方（この欄はさわらんでOK）"
      description: "書き換え不要です。そのまま送信してください。"
      value: |
        > [!IMPORTANT]
        > **ここに書いてあるのは、依頼そのものやなく、書いた人の解釈です。**
        >
        > **書く人へ**
        > 根拠なしに断定せん。断定するなら根拠も一緒に書く。
        > 頼まれた言葉を写すだけで終わらせず、その依頼が本当は何を目指しとるかを書く。
        > 判断がつかんかった所は、どこがなぜ分からんかったかを書く。
        >
        > **着手する人へ**
        > まず親Issue、元の会話、コード、ログを自分で開いて、本文と突き合わせる。
        >
        > **止まって確認すること** — 外から見える形が変わる場合。
        > 利用者に見える挙動、保存されるデータ、外部との取り決め、対応する範囲、完了する時期。
        > 目的・本文の記述・提案する形・そう考える理由の4点を書いて、指示者の返答を待つ。
        >
        > **止まらず進めてよいこと** — 外から見える形が変わらん場合。
        > 実装の順序、内部の構造、使うライブラリ、命名。選んだ理由をPRに1行残す。
        >
        > 進められん事情が出た時も同じです。できないと報告して終わらせず、
        > 目的・詰まっとる箇所・取りうる案を書いて返答を待つ。
        >
        > **本番障害やデータ損失が進行しとる場合は例外です。** 復旧を最優先でよい。
        > 何をどう判断して進めたかは、収束後にこのIssueに残す。
    validations:
      required: false
