name: "バグ修正・機能改修 (PBI)"
description: "既存機能のバグ修正・改修用のIssueテンプレート"
labels: ["bug"]
body:
  # ⚠️ この how-to-read ブロックは feature.yml と完全に同一です。
  #    文面を変更するときは、必ず両方のファイルに同じ内容を反映してください。
  - type: textarea
    id: how-to-read
    attributes:
      label: "この Issue の読み方 — 我思う、ゆえに我あり"
      description: "この欄は書き換え不要です。そのまま送信してください。"
      value: |
        > [!IMPORTANT]
        > **ここに書かれているのは、要求そのものではなく、書き手の解釈です。**
        >
        > **書くとき**
        > 根拠のない断定を置かないこと。断定するなら根拠も一緒に書くこと。
        > 依頼された言葉を写すだけで終わらせず、その要求が本当は何を目指しているかを本文に書くこと。
        > 判断がつかなかった箇所は、どこがなぜ判断できなかったのかを具体的に書くこと。
        >
        > **読んで着手するとき**
        > まず根拠にあたる。親Issue、元の会話、コード、ログを自分で開き、本文と突き合わせる。
        > そのうえで、本文と違う進め方をしたくなったときは、次で分ける。
        >
        > **止まって確認すること** — 完成したものの外から見える形が変わる場合。
        > 利用者に見える挙動、保存されるデータ、外部との取り決め、対応する範囲、完了する時期。
        > このいずれかが本文の記述と変わるなら、着手せずコメントを書く。
        > 書く内容は、目的・本文の記述・提案する形・そう考える理由の4点。
        > 指示者の返答を待ってから進める。
        >
        > **止まらず進めてよいこと** — 外から見える形が変わらない場合。
        > 実装の順序、内部の構造、使うライブラリ、命名。
        > 進めたうえで、選んだ理由をPRの説明文に1行残す。
        >
        > 進められない事情が出たときも同じです。できないと報告して終わらせず、
        > 目的・詰まっている箇所・取りうる案を書いて、指示者の返答を待つこと。
        >
        > 指示者とは、この作業を依頼した人です。判断がつかない場合、
        > このIssueの作成者ではなく、親Issueの作成者かプロジェクト管理者に確認すること。
        >
        > **本番障害やデータ損失が進行している場合は例外です。** 復旧を最優先に進めてよい。
        > 確認は事後で構いません。
        > ただし、何をどう判断して進めたかは、収束後に必ずこのIssueに残すこと。
        >
        > 確認は遅延ではありません。確認すべきものを確認し、進めてよいものを進める。
        > 目指しているのは、このプロジェクトが描いている姿に届くことです。
        >
        > <sub>すべてを疑ってなお、疑っている自分だけは疑えない、というデカルトの言葉から。
        > 与えられた前提を鵜呑みにせず、自分で確かめたことを確かなものとする。</sub>
    validations:
      required: false

  - type: textarea
    id: why
    attributes:
      label: "(Why?) なぜ、このタスクをやるのか？【必須】"
      description: |
        ビジネス視点で。エンジニアレベルの説明は How To? に書いてください。
        理由がはっきりすれば質が上がります。
      value: |
        <!-- ↓ なぜ直す必要があるのか、放置すると何が起きるのかを書いてください ↓ -->
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: "発生した事象【必須】"
      description: "期待される挙動と実際の挙動を具体的に。"
      value: |
        - 期待される挙動：
        - 実際の挙動：
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: "再現手順【必須】"
      description: "「1.」「2.」…の形で番号順に書いてください。"
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "深刻度【必須】"
      description: "🛑 Critical を選んだ場合、着手前の確認は不要です。復旧を優先し、判断の記録は事後に残してください。"
      options:
        - "🔴 Critical（本番障害・データ損失）"
        - "🟠 High（主要機能が使えない）"
        - "🟡 Medium（回避策あり）"
        - "🟢 Low（軽微・見た目の問題）"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "スクリーンショット / GIF / 動画（任意）"
      description: "🖼️ ドラッグ&ドロップ、またはクリップボードから貼り付け。mp4・mov・gif も同じ手順でアップロードできます。"
    validations:
      required: false

  - type: input
    id: page-url
    attributes:
      label: "画面URL（任意）"
      placeholder: "https://..."
    validations:
      required: false

  - type: input
    id: figma-url
    attributes:
      label: "FigmaデザインURL（任意）"
      placeholder: "https://www.figma.com/design/..."
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: "発生環境（任意）"
      value: |
        > [!NOTE]
        > 分かる範囲で構いません。ここが埋まっていると再現にかかる時間が大きく変わります。

        - 端末 / OS：
        - ブラウザ / アプリバージョン：
        - 発生頻度：
    validations:
      required: false

  - type: textarea
    id: how-to
    attributes:
      label: "(How To?) やり方の指定があるか？（任意）"
      description: |
        指定がある場合だけ書いてください。無指定なら空欄のままで構いません。

        <details>
        <summary>📝 記入例（クリックして展開）</summary>

        **良い例:**

        1. `src/features/auth/` の認証フローを修正する
        2. `server/src/modules/<機能名>/` のバリデーションロジックを見直す
        3. エラーハンドリングを追加して適切なメッセージを返す

        **該当ファイルパス:**
        - `src/features/auth/login-screen.tsx` (L45-L60)
        - `server/src/modules/<機能名>/<機能名>.service.ts` (L120)

        </details>
      value: |
        > [!WARNING]
        > ここに書いた内容は「指定」として扱われます。
        > より良い進め方に気づいた場合は、指定のまま進めず、確認をとってください。

        <!-- ↓ 該当ファイルパスが分かれば書いてください（分からなければ空欄でOK） ↓ -->
        - 該当ファイルパス： 🔗
    validations:
      required: false

  - type: textarea
    id: done-definition
    attributes:
      label: "(Complete!) 完成の定義(箇条書き)【必須】"
      description: |
        TIP（緑の囲み）は消さず、その下の `<!-- -->` の位置に書いてください。

        <details>
        <summary>📝 記入例（クリックして展開）</summary>

        **良い例:**

        - [ ] 問題が発生していた画面で、正しく表示されるようになっている
        - [ ] 修正前に起きていたエラーが再現しなくなっている
        - [ ] 他の画面や機能に影響が出ていない（デザイン崩れ等がない）
        - [ ] 対象の環境すべてで正常に動作する

        </details>
      value: |
        > [!TIP]
        > ここが最終的な合否ラインです。
        > 「動くこと」ではなく「何がどうなっていれば終わりか」を書いてください。

        <!-- ↓ 完成条件をチェックリスト形式で箇条書きしてください ↓ -->
        - [ ]
    validations:
      required: true

  - type: textarea
    id: else
    attributes:
      label: "(Else) その他共有事項（任意）"
      description: |
        共有しておくほど、後の確認往復が減ります。判断に迷った点もここへ。
    validations:
      required: false
